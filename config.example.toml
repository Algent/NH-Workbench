# Copy to the config path from the README (Windows: %APPDATA%\gtnh-devenv-tools\config.toml,
# Linux: ~/.config/gtnh-devenv-tools/config.toml). Everything is optional.

# root = "C:/Users/you/IdeaProjects"   # folder holding the checkouts
# org = "GTNewHorizons"                # its repos form the "gtnh" group; the All PRs tab lists its PRs
# refresh_minutes = 15                 # the UI rescans this often, 0 turns it off
# refresh_fetch = false                # true: auto-refresh fetches every repo instead of only rescanning
# pr_filters = ["local", "unreviewed"] # All PRs shows only: local, pack, unreviewed, stale (set with v)
# concurrency = 8                      # repos handled at the same time
# prune = true                         # drop stale remote-tracking refs on fetch
# ide_command = "C:/path/to/idea64.exe"  # false: no IDE actions at all
# cleanup_to_main = true  # cleanup offers merged branches still checked out, switching to main first

# Per repo, keyed by folder name.
[repos.ForgeEssentials]
tracked_branch = "1.7.10/develop"      # the branch that counts as "main" here
group = "reference"                    # override the automatic group
# keep_branches = ["algent/java"]      # never deleted by the merged-branch cleanup

[repos.SomeScratchRepo]
ignore = true                          # never listed, fetched or pulled

# Source of pack mods hosted outside the org, keyed by the name used in the daily manifest.
[pack.sources."Some External Mod"]
repo = "owner/name"
branch = "1.7.10"                      # only when it is not the repository default
# closed = true                        # no public source
