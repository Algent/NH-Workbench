[project]
name = "gtnh-devenv-tools"
version = "0.1.0"
description = "Keep track of many GTNH mod checkouts: fetch, safe pull, branches and PR status"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.14.5",
    "textual>=8.2.8",
    "typer>=0.29.1",
]

[project.scripts]
gtnh-dev = "gtnh_devenv_tools.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
