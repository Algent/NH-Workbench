# Where the source of pack mods hosted outside the GTNewHorizons org lives.
# Keys are the names used in DreamAssemblerXXL's manifests (case-insensitive).
# Override or extend in your config.toml under [pack.sources."<mod name>"].
#   repo   = "owner/name"
#   host   = forge the repo is on, when it is not github.com
#   branch = the branch the 1.7.10 version is built from
#   closed = true when there is no public source
#   status = active | passive | legacy (how alive development is)
#   note   = anything worth remembering

